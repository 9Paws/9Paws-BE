spring:
  application:
    name: ninepaws-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]

  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/

  threads:
    virtual:
      enabled: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${EMAIL_USERNAME:dev}
    password: ${EMAIL_PASSWORD:dev}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 30
    connect-retries-interval: 5

  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY:dummy-api-key}

server:
  address: 0.0.0.0

app:
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

  jwt:
    secret: ${JWT_SECRET:TmluZVBhd3NTdXBlclNlY3JldFNpZ25pbmdLZXlGb3JKd3RUb2tlbnNITUFDU0hBMjU2QXRMZWFzdDI1NkJpdHNMb25nMjAyNiE=}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

  otp:
    length: 6
    ttl-minutes: 2
    max-attempts: 3
    resend-cooldown-seconds: 60
    reset-max-per-hour: 3

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:demo}
    api-secret: ${CLOUDINARY_API_SECRET:demo}

  firebase:
    config-json: ${FIREBASE_CONFIG_JSON:}
    config-path: ${FIREBASE_CONFIG_PATH:classpath:firebase/firebase-adminsdk.json}
    app-name: ${FIREBASE_APP_NAME:ninepaws-backend}

  scalar:
    path: /docs
    url: /v3/api-docs
    enabled: true
