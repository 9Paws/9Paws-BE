server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    hikari:
      maximum-pool-size: 30

  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.ninepaws.backend: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
