server:
  port: ${DEV_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${EMAIL_USERNAME:dev}
    password: ${EMAIL_PASSWORD:dev}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  threads:
    virtual:
      enabled: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 30
    connect-retries-interval: 5

  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY:dummy-api-key}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}

app:
  jwt:
    secret: ${JWT_SECRET:TmluZVBhd3NTdXBlclNlY3JldFNpZ25pbmdLZXlGb3JKd3RUb2tlbnNITUFDU0hBMjU2QXRMZWFzdDI1NkJpdHNMb25nMjAyNiE=}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

  otp:
    length: ${OTP_LENGTH:6}
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    max-attempts: ${MAX_ATTEMPTS:3}
    resend-cooldown-seconds: ${RESEND_COOLDOWN_SECONDS:60}
    reset-max-per-hour: ${RESET_MAX_PER_HOUR:5}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:demo}
    api-secret: ${CLOUDINARY_API_SECRET:demo}

  scalar:
    path: ${SCALAR_PATH:/docs}
    url: ${SCALAR_URL:/v3/api-docs}
    enabled: ${SCALAR_ENABLED:true}

  backend:
    ip: ${BACKEND_IP:127.0.0.1}
logging:
  level:
    root: INFO
    com.ninepaws.backend: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG