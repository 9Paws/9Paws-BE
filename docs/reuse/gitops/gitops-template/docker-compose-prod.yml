services:
  backend:
    image: ghcr.io/9paws/ninepaws-backend:latest
    container_name: ninepaws-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - /opt/ninepaws/.env
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 500M

  postgres:
    image: postgres:17-alpine
    container_name: ninepaws-postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c max_connections=50
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 200M

  redis:
    image: redis:8-alpine
    container_name: ninepaws-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 100M

  nginx:
    image: nginx:1.27-alpine
    container_name: ninepaws-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - internal_net
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: ninepaws-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          memory: 32M

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
