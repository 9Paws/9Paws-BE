name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test -B

  build-and-deploy:
    name: Build Image & Propagate to GitOps
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Extract Project Version & Short SHA
        id: meta
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ninepaws-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/ninepaws-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/9Paws-Gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update Image Tag in docker-compose-prod.yml
        run: |
          cd gitops-repo
          IMAGE_LINE="image: ghcr.io/${{ github.repository_owner }}/ninepaws-backend:${{ steps.meta.outputs.tag }}"
          sed -i -E "s|image: ghcr.io/[^/]+/ninepaws-backend:.*|${IMAGE_LINE}|g" docker-compose-prod.yml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose-prod.yml
          if git diff --staged --quiet; then
            echo "No change in image tag."
          else
            git commit -m "deploy(backend): bump image to ${{ steps.meta.outputs.tag }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
